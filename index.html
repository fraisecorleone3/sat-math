<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAT Math — Tutoring Workspace</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#E9EBEF;--card:#FFFFFF;--ink:#111119;--graphite:#5A5C6B;
    --indigo:#4338F2;--indigo-soft:#E1DFFE;--amber:#D98407;--amber-soft:#FBEBCE;
    --green:#0B8A4B;--green-soft:#D2EFDF;--red:#D8352A;--red-soft:#FADEDC;
    --mono:"DM Mono",ui-monospace,Menlo,monospace;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --sh:5px 5px 0 var(--ink);--sh-sm:3px 3px 0 var(--ink);--bd:2.5px solid var(--ink);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(17,17,25,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,25,.045) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .wrap{max-width:980px;margin:0 auto;padding:24px 20px 110px}
  .mono{font-family:var(--mono)}
  h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.02em;margin:0}
  button{font-family:var(--body);cursor:pointer}
  input,select,textarea{font-family:var(--body);font-size:15px}
  a{color:var(--indigo)}
  ::selection{background:var(--indigo);color:#fff}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{background:var(--ink);border:var(--bd);box-shadow:var(--sh-sm);border-radius:13px;padding:9px 12px;display:flex;gap:6px}
  .mark i{width:12px;height:12px;border:2.5px solid #fff;border-radius:50%}
  .mark i.f{background:#fff}
  .brand h1{font-size:20px;font-weight:800;line-height:1.05}
  .brand .sub{font-family:var(--mono);font-size:10px;color:var(--graphite);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .who{font-family:var(--mono);font-size:12px;color:var(--graphite);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .who b{color:var(--ink);font-weight:500}

  .btn{border:var(--bd);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--sh-sm);transition:transform .05s,box-shadow .05s}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn.go{background:var(--indigo);color:#fff}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
  .btn.xs{padding:4px 10px;font-size:12px;border-radius:8px;box-shadow:2px 2px 0 var(--ink)}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .link{background:none;border:none;color:var(--indigo);padding:0;font-weight:700;font-size:14px}
  .link.danger{color:var(--red)}
  .back{font-family:var(--mono);font-size:12.5px;color:var(--graphite);background:none;border:none;padding:6px 0;margin-bottom:16px;display:inline-flex;gap:7px;align-items:center;font-weight:500}
  .back:hover{color:var(--ink)}
  .back svg{width:14px;height:14px}

  .card{background:var(--card);border:var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}
  .card.flat{box-shadow:var(--sh-sm)}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo);margin-bottom:7px}
  .muted{color:var(--graphite)}
  .tiny{font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .stack{display:flex;flex-direction:column;gap:16px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .stats{grid-template-columns:repeat(3,1fr);gap:12px}
  hr.div{height:2.5px;background:var(--ink);border:none;margin:18px 0;opacity:.1}
  .sect{font-size:14px;margin:26px 0 12px;font-family:var(--mono);font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}

  .tag{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
  .tag.hard{background:var(--red-soft);color:var(--red)}
  .tag.med{background:var(--amber-soft);color:var(--amber)}
  .tag.easy{background:var(--green-soft);color:var(--green)}
  .tag.mix{background:var(--indigo-soft);color:var(--indigo)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--indigo-soft);color:var(--indigo);font-weight:700;white-space:nowrap}
  .pill.done{background:var(--green-soft);color:var(--green)}
  .pill.todo{background:#fff;color:var(--graphite)}
  .pill.warn{background:var(--amber-soft);color:var(--amber)}
  .pill.bad{background:var(--red-soft);color:var(--red)}

  .hero h2{font-size:36px;line-height:1.02;font-weight:800}
  .hero .hl{color:var(--indigo)}
  .stat{background:var(--card);border:var(--bd);border-radius:14px;padding:14px 16px;box-shadow:var(--sh-sm)}
  .stat .n{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1}
  .stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite);margin-top:6px}

  label.fld{display:block;margin-bottom:14px}
  label.fld .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite);display:block;margin-bottom:6px}
  input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 13px;border:var(--bd);border-radius:11px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:var(--sh-sm)}
  textarea{resize:vertical;min-height:74px;line-height:1.5;font-family:var(--mono);font-size:13px}

  /* answer-sheet strip */
  .sheet{position:sticky;top:10px;z-index:30;background:var(--card);border:var(--bd);border-radius:14px;box-shadow:var(--sh);padding:12px 15px;margin-bottom:20px}
  .sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .sheet .stitle{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}
  .sheet .clock{font-family:var(--mono);font-size:19px;font-weight:500;padding:2px 10px;border:2px solid var(--ink);border-radius:9px}
  .sheet .clock.warn{background:var(--red);color:#fff;border-color:var(--red)}
  .strip{display:flex;flex-wrap:wrap;gap:6px}
  .dot{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;font-family:var(--mono);font-size:10.5px;display:grid;place-items:center;cursor:pointer;color:var(--graphite);padding:0}
  .dot.filled{background:var(--ink);color:#fff}
  .dot.flagged{box-shadow:0 0 0 3px var(--amber-soft);border-color:var(--amber)}
  .dot.ok{background:var(--green);border-color:var(--green);color:#fff}
  .dot.ko{background:var(--red);border-color:var(--red);color:#fff}

  .qcard{background:var(--card);border:var(--bd);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--sh);scroll-margin-top:130px}
  .qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
  .qnum{font-family:var(--disp);font-weight:700;font-size:16px}
  .stem{font-size:17px;margin:8px 0 18px;line-height:1.6;white-space:pre-line;overflow-x:auto}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:14px;padding:12px 15px;border:var(--bd);border-radius:12px;background:#fff;cursor:pointer;transition:transform .06s,box-shadow .06s;text-align:left;font-size:15.5px;color:var(--ink)}
  .choice:hover{transform:translate(-1px,-1px);box-shadow:var(--sh-sm)}
  .choice .bub{flex:none;width:32px;height:32px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:13px}
  .choice.sel{background:var(--indigo-soft)}
  .choice.sel .bub{background:var(--indigo);color:#fff}
  .choice.correct{background:var(--green-soft)}
  .choice.correct .bub{background:var(--green);border-color:var(--green);color:#fff}
  .choice.wrong{background:var(--red-soft)}
  .choice.wrong .bub{background:var(--red);border-color:var(--red);color:#fff}
  .choice .ctext{flex:1;overflow-x:auto}
  .figwrap{display:block;margin:14px 0 6px;overflow-x:auto;white-space:normal}
  .qfig,.cfig{display:block;max-width:100%;height:auto;background:#fff}
  .qfig{margin:0 auto}
  .cfig{max-height:260px}
  .figmiss{font-family:var(--mono);font-size:11.5px;color:var(--graphite);border:2px dashed var(--line,#ccc);border-radius:8px;padding:8px 12px;display:inline-block}
  .tag.ttag{background:#fff;color:var(--graphite);border-color:var(--graphite)}
  .tagsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);margin:10px 0 6px}
  .choice[disabled]{cursor:default}
  .choice[disabled]:hover{transform:none;box-shadow:none}
  .spr{max-width:290px}
  .spr input{font-family:var(--mono);font-size:19px;text-align:center;letter-spacing:.04em}

  .flagbtn{border:var(--bd);background:#fff;color:var(--graphite);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--sh-sm);white-space:nowrap}
  .flagbtn:active{transform:translate(3px,3px);box-shadow:none}
  .flagbtn.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
  .flagbtn svg{width:15px;height:15px}

  .sol{margin-top:16px;border:var(--bd);border-radius:13px;overflow:hidden}
  .sol h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;padding:9px 15px;background:var(--ink);color:#fff;font-weight:400}
  .sol .steps{padding:14px 16px;background:#fff}
  .sol .steps div{font-size:14.5px;line-height:1.6;padding:5px 0;border-bottom:1px dashed rgba(17,17,25,.13);overflow-x:auto}
  .sol .steps div:last-child{border-bottom:none}
  .sol .mhead{display:flex;align-items:center;gap:10px;padding:8px 16px 0;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
  .sol .mhead+.steps{padding-top:6px}
  .sol .steps+.mhead{border-top:var(--bd);padding-top:12px}
  .sol .mhead .mtag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);font-weight:500}
  .sol .mhead.fast .mtag{background:var(--green-soft);color:var(--green);border-color:var(--green)}
  .sol .mhead.desmos .mtag{background:var(--indigo-soft);color:var(--indigo);border-color:var(--indigo)}
  .sol .mhead.classic .mtag{background:#fff;color:var(--graphite);border-color:var(--graphite)}
  .sol .tip{padding:12px 16px;background:var(--amber-soft);border-top:var(--bd);font-size:14px}
  .sol .tip b{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--amber)}

  table.qt{border-collapse:collapse;margin:12px 0;font-size:14.5px}
  table.qt th,table.qt td{border:2px solid var(--ink);padding:7px 13px;text-align:center}
  table.qt th{background:var(--indigo-soft);font-family:var(--mono);font-size:12.5px;font-weight:500}

  .switch{display:flex;align-items:center;gap:12px;padding:13px 15px;border:var(--bd);border-radius:12px;background:#fff;cursor:pointer}
  .switch .track{width:48px;height:27px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;position:relative;flex:none;transition:background .12s}
  .switch .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;background:var(--ink);border-radius:50%;transition:left .12s}
  .switch.on .track{background:var(--indigo)}
  .switch.on .knob{left:24px;background:#fff}

  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .tab{border:var(--bd);background:var(--card);padding:9px 16px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--sh-sm)}
  .tab.on{background:var(--indigo);color:#fff}
  .tab:active{transform:translate(3px,3px);box-shadow:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:2px solid var(--ink);background:#fff;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff}

  .empty{text-align:center;padding:42px 22px;color:var(--graphite);border:2.5px dashed var(--ink);border-radius:16px;background:var(--card)}
  .scorebig{font-family:var(--disp);font-weight:800;font-size:54px;line-height:1}
  .barback{height:13px;background:#fff;border:var(--bd);border-radius:99px;overflow:hidden}
  .barfill{height:100%;background:var(--indigo)}
  .mini{width:90px;height:9px;border-width:2px;flex:none}
  .mini .barfill{background:var(--green)}

  .modal-bg{position:fixed;inset:0;background:rgba(17,17,25,.5);display:grid;place-items:center;padding:20px;z-index:60}
  .modal{background:var(--paper);border-radius:20px;border:var(--bd);box-shadow:var(--sh);padding:26px;max-width:680px;width:100%;max-height:88vh;overflow:auto}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:90;box-shadow:var(--sh);max-width:90vw}

  /* collapsible tree (domains > skills > quizzes) */
  details.acc{border:var(--bd);border-radius:14px;background:var(--card);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh-sm)}
  details.acc>summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .ttl{display:flex;align-items:center;gap:10px;min-width:0}
  details.acc>summary .chev{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;transition:transform .12s;font-size:11px}
  details.acc[open]>summary .chev{transform:rotate(90deg)}
  details.acc[open]>summary{border-bottom:var(--bd)}
  details.acc>.abody{padding:12px 14px 4px}
  details.acc.dom>summary h3{font-size:18px}
  details.acc.sk{box-shadow:none;border-width:2px;border-radius:12px;margin-bottom:10px}
  details.acc.sk>summary{padding:11px 14px}
  details.acc.sk>summary b{font-size:14.5px}
  details.acc.sk[open]>summary{border-bottom:2px solid var(--ink)}
  details.acc.sk>.abody{padding:8px 10px}
  .qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 8px;border-radius:9px;flex-wrap:wrap}
  .qrow+.qrow{border-top:1px dashed rgba(17,17,25,.15)}
  .qrow:hover{background:var(--paper)}
  .qrow .nm{font-weight:600;font-size:14.5px}
  .lvlhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin:8px 8px 2px}

  /* tri-state checkboxes for the access tree */
  .cb{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:7px;flex:none;display:grid;place-items:center;background:#fff;cursor:pointer;padding:0}
  .cb svg{width:13px;height:13px;opacity:0}
  .cb.on{background:var(--indigo)}
  .cb.on svg{opacity:1}
  .cb.part{background:var(--indigo-soft)}
  .cb.part::after{content:"";width:10px;height:3px;background:var(--indigo);border-radius:2px}
  .cb.part svg{display:none}

  table.grid{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
  table.grid th,table.grid td{border:2px solid var(--ink);padding:6px 10px;text-align:left}
  table.grid th{background:var(--indigo-soft);font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  table.grid td.n{text-align:right;font-family:var(--mono)}

  .boot{max-width:420px;margin:80px auto;text-align:center;color:var(--graphite);font-family:var(--mono);font-size:13px}

  @media(max-width:600px){.stat{padding:10px 12px}.stat .n{font-size:22px}.stat .l{font-size:9.5px}.wrap{padding:18px 14px 90px}.hero h2{font-size:27px}.scorebig{font-size:42px}.stem{font-size:16px}.mini{width:60px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="boot">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
